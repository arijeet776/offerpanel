services:
  - type: web
    name: digisanchaar-api
    runtime: node
    plan: free            # use "starter" for live traffic: free plans sleep and can miss network postbacks
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_COMPANY_NAME
        sync: false
      - key: FRONTEND_URL            # https://offers.digisanchaar.online  (CORS: who may call this API)
        sync: false
      - key: PUBLIC_BASE_URL         # https://offers.digisanchaar.online  (used to build partner links)
        sync: false
      - key: API_PUBLIC_URL          # optional: your backend's public URL if it is not the onrender.com one
        sync: false
      - key: POSTBACK_SECRET         # auto-generated; shows up inside every campaign's Postback URL
        generateValue: true
      - key: MIN_WITHDRAWAL
        value: "50"
      - key: SHEETS_WEBHOOK_URL
        sync: false
      - key: SHEETS_SECRET
        sync: false
